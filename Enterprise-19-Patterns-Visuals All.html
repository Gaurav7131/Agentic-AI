      .user(goal).call().entity(ExecutionPlan.class);

    List<String> auditTrails = new ArrayList<>();

      if (success) {
        rollbackStack.push(step);
        auditTrails.add("Step "+step.stepId()+" SUCCESS");
      } else {
        while (!rollbackStack.isEmpty()) {
          ExecutionStep rb = rollbackStack.pop(); // LIFO
          service.rollbackStep(rb);
          auditTrails.add("COMPENSATED: "+rb.targetResource());
        }
        return new ExecutionResult(plan.planGoal(),
          "COMPENSATED", auditTrails,
          "Halted at step:"+step.stepId());
      }
    }
    return new ExecutionResult(plan.planGoal(),
      "SUCCESS", auditTrails, "");
  }
}`},17:{lang:"java",file:"CorrectiveRagService.java",code:`String generate(String query) {

<script>
// Hash routing for README deep links: #pattern-09, #pattern-16-saga etc.
(function(){
  function selectFromHash(){
    try{
      var h = (location.hash||'').toLowerCase();
      var m = h.match(/pattern[-_]?0*(\d{1,2})/);
      if(m){
        var id = parseInt(m[1],10);
        if(id>=1 && id<=19){
          // try to find React setter via UI clicks
          var el = document.querySelector('[data-pattern-id="'+id+'"]');
          if(el) el.click();
          // dispatch custom event for app to listen
          window.dispatchEvent(new CustomEvent('select-pattern',{detail:{id:id}}));
          // store in localStorage so app can pick up on load
          localStorage.setItem('enterprise_pattern_select', String(id));
        }
      }
    }catch(e){}
  }
  window.addEventListener('hashchange', selectFromHash);
  window.addEventListener('load', function(){ setTimeout(selectFromHash, 300); });
  selectFromHash();
})();
</script>
